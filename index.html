<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <meta name="description" content="Traccia i tuoi allenamenti in palestra: sessioni, storico e progressi.">
  <title>GymLog — Allenamenti</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header id="app-header">
    <h1 id="app-title">GymLog</h1>
    <div id="header-sub"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="toast" class="toast" role="status"></div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <nav id="tabbar">
    <button class="tab" data-route="#/oggi" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4z" fill="currentColor"/><path d="M16 8a5 5 0 0 1 0 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>Oggi</span>
    </button>
    <button class="tab" data-route="#/storico" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 4h12l-3 4 3 4H6" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
      <span>Storico</span>
    </button>
    <button class="tab" data-route="#/statistiche" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Statistiche</span>
    </button>
    <button class="tab" data-route="#/impostazioni" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <span>Impostazioni</span>
    </button>
  </nav>

  <script src="./js/data.js" defer></script>
  <script src="./js/store.js" defer></script>
  <script src="./js/charts.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
